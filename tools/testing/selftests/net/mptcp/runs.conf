# run_matrix.sh config -- one run-GROUP per line: "<label>  <env...>"
# KEY={a,b,c} sweeps into one run per value (label gets the value appended).
# Run `REPEAT=3 ./run_matrix.sh` on each kernel and diff the tables.
# This is the FULL matrix; comment out lines for a quicker pass.

# --- no-regression baseline suite (all bounds meaningful) ---
suite             SCENARIO=suite

# --- send-buffer-limited: the benefit regime + its fast-path-alone floor ---
sndbuf            SCENARIO=sndbuf SNDBUF={65536,131072}
sndbuf_solo       SOLO=1 SCENARIO=sndbuf SNDBUF=65536

# --- receive-window-limited: patch 2's regime, swept across window pressure ---
rwnd              SCENARIO=rwnd RCVBUF={131072,262144,524288}

# --- sndbuf > rcvbuf (Sashiko/Matt "did you validate"): the guard question ---
sndbuf_hi         SCENARIO=sndbuf_hi SNDBUF=262144 RCVBUF={131072,196608}

# --- both limited: the dangerous corner ---
both              SCENARIO=both RCVBUF=262144 SNDBUF=65536

# --- unbounded (autotuned), swept over the slow-path delay ---
unbounded         SCENARIO=unbounded SLOW_DELAY={20,30,50}
unbounded_solo    SOLO=1 SCENARIO=unbounded

# --- one path bufferbloated: the canonical #345 target, swept over queue depth ---
bloat             SCENARIO=bloat BLOAT_LIMIT={50,100,200}
bloat_solo        SOLO=1 SCENARIO=bloat
